# /etc/turnserver.conf
#
# coturn com segredo compartilhado: o servidor gera usuario e senha
# temporarios em /api/ice usando o MESMO valor de TURN_SECRET do .env.
# Se os dois nao baterem, o TURN recusa e a chamada morre so quando
# alguem estiver atras de NAT dificil — ou seja, voce so descobre no dia.

listening-port=3478
fingerprint

# Autenticacao por segredo, sem cadastrar usuario nenhum.
use-auth-secret
static-auth-secret=TROQUE_PELO_MESMO_VALOR_DE_TURN_SECRET

# Troque pelo seu dominio. O realm entra no calculo da credencial.
realm=seu-host.duckdns.org

# IP publico da VM. Na Oracle a placa enxerga so o IP privado, entao sem
# esta linha o coturn anuncia um endereco que ninguem alcanca.
external-ip=SEU_IP_PUBLICO

# Faixa de portas de relay. Precisa estar aberta no firewall da Oracle E no
# iptables do Ubuntu — sao duas paredes diferentes.
min-port=49152
max-port=65535

# Uso pessoal: nada de quota nem de relay para a rede interna.
no-multicast-peers
no-cli
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Ligue quando quiser diagnosticar; o log cresce rapido.
# verbose
